<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>云存档</title>
    <link rel="stylesheet" type="text/css" href="css/baye.css?ver=1"/>
    <link rel="icon" href="favicon.png">
    <meta content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" id="viewport"
          name="viewport">
</head>
<body>
<header style="padding: 10px 0;position: relative">
    <h3>云存档管理<span class="online-save-msg" style="font-size: .8em; font-weight: normal;padding: 0 10px"></span></h3>
    <div>
        <a href="index.html">返回首页</a>
    </div>
    <div class="no-login" style="color: red;position: absolute;right: 0;top: 0">
        <a href="https://graph.qq.com/oauth2.0/authorize?response_type=code&client_id=102021419&redirect_uri=https%3A%2F%2Foauth.bbkgames.com%2Fqqcallback%3Furl%3Dhttps%3A%2F%2Fbaye.bbkgames.com%2Fonline-save.html&state=web">
            <img src="https://img.bbkgames.com/web/image/bt_blue_76X24.png">
        </a>
    </div>
    <div class="user-info" style="display: none;position: absolute;right: 0;top: 0">
        <img class="avatar" src="https://baye.bbkgames.com/favicon.png" style="width: 32px;height: 32px">
    </div>
    <p>三国霸业原版云存档</p>
    <p>可上传或下载原版存档</p>
</header>

<main>
    <div class="online-save-slots"></div>
</main>

<script src="js/jquery.min.js"></script>
<script src="js/save-storage.js?ver=20261008h"></script>
<script src="js/original-game.js?ver=20261010b"></script>
<script src="https://img.bbkgames.com/script/js-sdk.js?ver=20260329"></script>
<script>
    $(function () {
        if ('undefined' === typeof BBKSDK) {
            return;
        }
        const originalLibPath = BayeOriginalGame.path;
        const originalCloudName = 'dat-mod.lib';
        let $onlineSaveMsg = $('.online-save-msg'), $onlineSaveSlots = $('.online-save-slots');
        let savDir = ''; //来自登录接口返回
        renderSaveBtns();

        //尝试登录
        BBKSDK.getUserInfo(function (res) {
            if (!res || !res.nickname) {
                return;
            }
            //save_dir
            if (!res.sav_dir) {
                showError('未找到存档dir, 请联系开发者');
                return;
            }
            $('.no-login').hide();
            $('.avatar').attr('src', res.avatar);
            $('.user-info').show();
            savDir = res.sav_dir;
            renderSaveBtns();
        });

        //上传下载
        $onlineSaveSlots.on('click', '.upload', function () {
            let $this = $(this), index = $this.attr('data-index');
            let localSave0, localSave1, localSaveLib0, localSaveLib1, identity0, identity1;
            try {
                localSave0 = BayeSaveStorage.readMetadata('baye//data//sango' + (index * 2 - 2) + '.sav');
                localSave1 = BayeSaveStorage.readMetadata('baye//data//sango' + (index * 2 - 1) + '.sav');
                localSaveLib0 = BayeSaveStorage.readMetadata('baye//data//sango' + (index * 2 - 2) + '.sav.lib');
                localSaveLib1 = BayeSaveStorage.readMetadata('baye//data//sango' + (index * 2 - 1) + '.sav.lib');
                identity0 = BayeSaveStorage.readMetadata('baye//data//sango' + (index * 2 - 2) + '.sav.lib-id');
                identity1 = BayeSaveStorage.readMetadata('baye//data//sango' + (index * 2 - 1) + '.sav.lib-id');
            } catch (e) {
                showError('无法读取存档');
                return;
            }
            if (!BayeSaveStorage.validatePair(localSave0, localSave1)) {
                showError('存档为空或不完整');
                return;
            }
            if (localSaveLib0 !== originalLibPath || localSaveLib1 !== originalLibPath ||
                (identity0 && identity0 !== BayeOriginalGame.saveIdentity) ||
                (identity1 && identity1 !== BayeOriginalGame.saveIdentity)) {
                showError('此存档不属于原版，请先导出保留');
                return;
            }
            let data = localSave0 + '\n' + localSave1;
            $this.prop('disabled', true);
            BBKSDK.uploadSave('baye', originalCloudName, index, data, function (res) {
                $this.prop('disabled', false);
                let data = JSON.parse(res);
                if (data && 'undefined' !== typeof data.code) {
                    if (0 === data.code) {
                        showMsg('上传成功');
                        $this.parent().find('.save-time').text(`时间: ${data.msg || ''}`);
                        $this.parent().find('.download').prop('disabled', false).attr('data-url', data.data);
                    } else {
                        showError(`上传失败: ${data.msg}`);
                    }
                } else {
                    showError(`上传失败`);
                }
            });
        });
        $onlineSaveSlots.on('click', '.download', function () {
            let $this = $(this), index = $this.attr('data-index'), url = $this.attr('data-url');
            $this.prop('disabled', true);
            BBKSDK.getSave(url, function (res) {
                $this.prop('disabled', false);
                let arr = typeof res === 'string' ? res.trim().split(/\r?\n/) : [];
                if (2 !== arr.length) {
                    showError('存档不存在或已损坏');
                    return;
                }
                if (!BayeSaveStorage.importSlot(Number(index) - 1,
                    { sav0: arr[0], sav1: arr[1], lib: originalLibPath })) {
                    showError(BayeSaveStorage.lastError().message);
                    return;
                }
                showMsg('导入成功');
                $this.parent().find('.upload').prop('disabled', false).attr('data-index', index);
            });
        });

        //渲染基本dom 本地存档按钮
        function renderSaveBtns() {
            $onlineSaveSlots.empty();

            //仅原版目录的完整本地存档可上传，其他版本的元数据保持不变。
            for (let i = 0; i < 3; i++) {
                let $item = $(`<div>
                    <span class="save-name"></span>
                    <button type="button" class="upload" disabled>上传</button>
                    <button type="button" class="download" disabled>下载</button>
                    <span class="save-time"></span>
                </div>`);
                $item.find('.save-name').text(`存档-${i + 1}`);
                //本地存档
                let localSaveLib0 = BayeSaveStorage.readMetadata('baye//data//sango' + (i * 2) + '.sav.lib');
                let localSaveLib1 = BayeSaveStorage.readMetadata('baye//data//sango' + (i * 2 + 1) + '.sav.lib');
                let localSave0 = BayeSaveStorage.readMetadata('baye//data//sango' + (i * 2) + '.sav');
                let localSave1 = BayeSaveStorage.readMetadata('baye//data//sango' + (i * 2 + 1) + '.sav');
                let identity0 = BayeSaveStorage.readMetadata('baye//data//sango' + (i * 2) + '.sav.lib-id');
                let identity1 = BayeSaveStorage.readMetadata('baye//data//sango' + (i * 2 + 1) + '.sav.lib-id');

                //两半存档必须归属同一原版路径，不能仅按文件名匹配。
                let hasLocalSave = false;
                if (localSave0 && localSave1 && localSaveLib0 && localSaveLib1
                    && localSaveLib0 === originalLibPath && localSaveLib1 === originalLibPath
                    && (!identity0 || identity0 === BayeOriginalGame.saveIdentity)
                    && (!identity1 || identity1 === BayeOriginalGame.saveIdentity)
                    && BayeSaveStorage.validatePair(localSave0, localSave1)) {
                    hasLocalSave = true;
                }
                if (hasLocalSave) {
                    //本地有
                    $item.find('.upload').prop('disabled', false).attr('data-index', i + 1);
                }
                $onlineSaveSlots.append($item);
            }

            //如果已登录, 则加载线上存档状态
            if (!savDir) {
                return;
            }

            //加载线上存档状态
            BBKSDK.getSaveIndex('baye', savDir, function (res) {
                let slots = {};
                if (res.length > 0) {
                    for (let i = 0; i < res.length; i++) {
                        let item = res[i];
                        if ('baye' === item.game && originalCloudName === item.mod_name) {
                            slots[item.index] = item;
                        }
                    }
                }
                //开始渲染
                for (let i = 0; i < 3; i++) {
                    let $item = $onlineSaveSlots.children().eq(i);
                    //线上存档
                    let data = slots[i + 1];
                    if ('undefined' !== typeof data) {
                        //线上有
                        $item.find('.download').prop('disabled', false).attr('data-index', i + 1).attr('data-url', data.file);
                        $item.find('.save-time').text(`时间: ${data.time || ''}`);
                    }
                }
            });
        }

        function showMsg(msg) {
            $onlineSaveMsg.css({color: '#000'}).text(msg);
        }

        function showError(msg) {
            $onlineSaveMsg.css({color: 'red'}).text(msg);
        }
    });
</script>
</body>
</html>
