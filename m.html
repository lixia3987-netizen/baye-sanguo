<script>
    window.bayeDebugMode = window.location.href.match(/(localhost|debug=1)/);
    //goHomeIfNeeded
    (function() {
        if (!bayeDebugMode) {
            match = window.location.hash.match(/#([0-9]*)/i);
            if(match){
                var ts = parseInt(match[1]);
                var now = new Date().getTime() / 1000;
                var dt = now - ts;
                if (ts && 0 <= dt && dt < 3600) {
                    return;
                }
            }
            window.location.href = "index.html";
        }
    })();
</script>

<script>
var mobileTouch = null;
function reloadLCD(){
    if (mobileTouch) { mobileTouch.cancel(); }
    var rect = document.getElementById('hd-mobile-stage').getBoundingClientRect();
    var height = rect.height, width = rect.width, ratio = lcdWidth / lcdHeight;
    if (!(height > 0 && width > 0)) { return; }
    if (height > width) {
        var rotatedWidth = Math.min(height, width * ratio);
        var rotatedHeight = rotatedWidth / ratio;
        $("#lcd").css({
            'height': rotatedHeight + 'px',
            'width': rotatedWidth + 'px',
            'left': (width - rotatedHeight) / 2 + 'px',
            'top': (height - rotatedWidth) / 2 + 'px',
            'transform-origin' : 'left top',
            'transform' : 'rotate(-90deg) translateX(-' + rotatedWidth + 'px)',
        });
        lcdRotateMode = 2;
    } else {
        var canvasWidth = Math.min(width, height * ratio);
        var canvasHeight = canvasWidth / ratio;
        $("#lcd").css({
            'height' : canvasHeight + 'px',
            'width' : canvasWidth + 'px',
            'left': (width - canvasWidth) / 2 + 'px',
            'top': (height - canvasHeight) / 2 + 'px',
            '-webkit-transform' : 'rotate(0deg)',
            'transform' : 'rotate(0deg)',
        }); 
        lcdRotateMode = 0;
    }
}

Module.postRun = function (){
    lcdInit();
    mobileTouch = touchScreenInit("lcd");
    reloadLCD();
    BayeHdMobile.init();
    BayeHdMobileMap.init();
    BayeHdMobileCity.init();
    BayeHdMobilePortraits.init();
    BayeHdMobileBattle.init();

    //判断手机横竖屏状态：
    window.addEventListener("onorientationchange" in window ? "orientationchange" : "resize", function() {
        reloadLCD();
    }, false);

    $(window).resize(reloadLCD);
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', reloadLCD);
    }

    if (bayeDebugMode) {
        $("#info").show();
    } else {
        $("#info").hide();
    }
    bayeMain();
};
</script>
