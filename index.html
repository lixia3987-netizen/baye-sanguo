<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <title>三国霸业</title>
        <link rel="stylesheet" type="text/css" href="css/baye.css" />
        <link rel="stylesheet" type="text/css" href="css/hd-graphics.css" />
        <link rel="stylesheet" type="text/css" href="css/hd-overworld.css" />
        <link rel="icon" href="favicon.png">
        <link rel="manifest" href="manifest.json">
        <link rel="apple-touch-icon" href="favicon.png">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" id="viewport" name="viewport">
        <script>
        if (window.location.pathname == '/baye') {
            window.location = '/baye/'
        }
        var _hmt = _hmt || [];
        (function() {
          var hm = document.createElement("script");
          hm.src = "//hm.baidu.com/hm.js?55cdc246d0c836cecfdf39ce0d5657f3";
          var s = document.getElementsByTagName("script")[0];
          s.parentNode.insertBefore(hm, s);
        })();
        </script>
        <script>
            (function () {
                try {
                    if (localStorage.getItem('baye/lcdTheme') === 'hd') {
                        document.documentElement.setAttribute('data-baye-theme', 'hd');
                    }
                    document.documentElement.setAttribute(
                        'data-baye-overworld',
                        localStorage.getItem('baye/overworldMode') === 'hd-map' ? 'hd-map' : 'classic'
                    );
                } catch (e) {}
            })();
        </script>
        <script src="js/jquery.min.js"></script>
        <script src="js/lcd.js?ver=20260329"></script>
        <script src="js/hd-graphics.js?ver=20260918"></script>
        <script src="js/hd-overworld.js?ver=20260918"></script>
        <style>
            .index-tip {
                color: red;
            }
            select {
                font-size: 16px;
            }
            .config-item {
                margin-top: 8px;
            }
        </style>
    </head>
    <body >
        <div class="container" style="margin-top:2px">
            <button class="btn menu" type="button" onclick="location='choose.html';">选择版本</button>
        </div>
        <div class="container" style="margin-top:2px">
            <button class="btn menu" type="button" onclick="redirect()">进入游戏</button>
        </div>
        <div class="container" style="margin-top:10px">
            <button class="btn menu" type="button" onclick="location='online-save.html';">存档管理(新)</button>
        </div>
        <div class="container" style="margin-top:10px"></div>
        <div>
            <div class="config-item">
                操作模式:
                <select name="" id="mode-select">
                    <option value="0">横屏&触控</option>
                    <option value="2">横屏&手势</option>
                    <option value="1">竖屏&键盘</option>
                    <option value="3">竖屏&键盘&触控</option>
                </select>
            </div>
            <div class="config-item">
                分辨率:
                <select name="" id="resolution-select">
                    <option value="0">4988</option>
                    <option value="1">加大</option>
                </select>
            </div>
            <div class="config-item">
                终端:
                <select name="" id="device-select">
                    <option value="" selected="selected">自动检测</option>
                    <option value="mobile">移动端</option>
                    <option value="desktop">桌面端</option>
                </select>
            </div>
            <div class="config-item">
                PC 画质缩放:
                <select id="lcd-scale-select">
                    <option value="1">经典 1×（480×288，默认）</option>
                    <option value="2">清晰 2×（960×576，锐利放大）</option>
                </select>
            </div>
            <div class="config-item">
                缩放滤镜:
                <select id="lcd-filter-select">
                    <option value="crisp">锐利（邻近取样，默认）</option>
                    <option value="smooth">平滑（双线性）</option>
                </select>
            </div>
            <div class="config-item">
                外壳主题:
                <select id="lcd-theme-select">
                    <option value="classic">经典（默认）</option>
                    <option value="hd">HD 外壳（仅页面框，不改游戏图）</option>
                </select>
            </div>
            <div class="config-item">
                大地图:
                <select id="overworld-mode-select">
                    <option value="classic">经典 LCD（默认）</option>
                    <option value="hd-map">HD 策略地图（pc.html 1080p 壳）</option>
                </select>
            </div>
            <p class="hd-graphics-note">画质缩放目前只作用于 PC 键盘版（<code>pc.html</code>）。手机页已铺满屏幕，强行 2× 会破坏触控与虚拟键布局。HD 地图是另一套开关（<code>baye/overworldMode</code>），默认经典；在 <code>pc.html</code> 画质条可即时切换。计划见 <a href="docs/hd-graphics.md">docs/hd-graphics.md</a> 与 <a href="docs/hd-overworld-spec.md">docs/hd-overworld-spec.md</a>。</p>
            <div class="config-item">
                交流QQ群: 526266208<br>
            </div>
        </div>
        <script>
                $(function(){
                    function bind(id, key) {
                        $(id).val(window.localStorage[key] || '0');
                        $(id).change(function () {
                            window.localStorage[key] = $(this).val();
                        });
                    }
                    bind("#mode-select", "baye/mpage");
                    bind("#resolution-select", "baye/resolution");
                    bind("#device-select", "baye/uiKind");

                    function bindHd(id, key, fallback) {
                        var current = window.localStorage[key];
                        $(id).val(current || fallback);
                        $(id).change(function () {
                            window.localStorage[key] = $(this).val();
                        });
                    }
                    bindHd("#lcd-scale-select", "baye/lcdCssScale", "1");
                    bindHd("#lcd-filter-select", "baye/lcdFilter", "crisp");
                    bindHd("#lcd-theme-select", "baye/lcdTheme", "classic");
                    bindHd("#overworld-mode-select", "baye/overworldMode", "classic");
                    if (window.BayeHd) {
                        BayeHd.applyTheme();
                        $("#lcd-theme-select").change(function () {
                            BayeHd.setTheme($(this).val());
                        });
                    }
                });
            </script>
    </body>
</html>
